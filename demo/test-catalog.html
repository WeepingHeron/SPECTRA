<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SPECTRA · 전체 테스트 문서 결과</title>
  <style>
    :root{color-scheme:dark;--bg:#050505;--panel:#0a0a0a;--line:#292929;--ink:#f4f4f2;--muted:#a9a9a3;--dim:#74746e;--green:#6ee7a0;--amber:#f4d35e;--red:#ff8585}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif}button{font:inherit}.app{min-height:100vh;padding:18px;display:grid;gap:13px}.top{display:flex;align-items:flex-start;justify-content:space-between;gap:20px}.eyebrow{color:var(--dim);font:800 11px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.15em}.top h1{margin:8px 0 6px;font-size:34px;line-height:1.12;letter-spacing:-.035em}.top p{margin:0;color:var(--muted);font-size:15px;line-height:1.5}.source{display:grid;justify-items:end;gap:8px}.source b{padding:9px 11px;border:1px solid var(--line);color:var(--amber);font:800 11px/1 ui-monospace,SFMono-Regular,Menlo,monospace}.source button{border:1px solid var(--green);background:#07130c;color:var(--green);padding:9px 12px;font-size:13px;font-weight:800;cursor:pointer}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line)}.metric{background:var(--panel);padding:13px 15px}.metric span{display:block;color:var(--dim);font:750 11px/1 ui-monospace,SFMono-Regular,Menlo,monospace}.metric b{display:block;margin-top:7px;font-size:27px}.section{border:1px solid var(--line);background:var(--panel)}.section-head{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:13px 14px;border-bottom:1px solid var(--line)}.section-head b{font-size:16px}.section-head span{color:var(--dim);font-size:12px;line-height:1.35}.table-wrap{overflow:auto;max-height:43vh}table{width:100%;min-width:900px;border-collapse:collapse;table-layout:fixed}th{position:sticky;top:0;z-index:2;background:#111;color:var(--dim);text-align:left;font:800 10px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.06em}th,td{padding:12px 10px;border-bottom:1px solid #202020;vertical-align:top}th:nth-child(1){width:28%}th:nth-child(2){width:13%}th:nth-child(3){width:25%}th:nth-child(4){width:15%}th:nth-child(5){width:19%}td{color:var(--muted);font-size:13px;line-height:1.42;word-break:keep-all}td strong{display:block;color:#fff;font-size:14px}td small{display:block;margin-top:5px;color:var(--dim);font-size:11px;line-height:1.35}.pass{color:var(--green)!important}.hold,.stopped{color:var(--amber)!important}.bad{color:var(--red)!important}.source-link{display:block;margin-top:5px;color:var(--green);text-decoration:none}.stage-track{display:grid;grid-template-columns:repeat(2,1fr);gap:5px}.stage-step{padding:7px;border:1px solid #303030;background:#070707}.stage-step b,.stage-step span{display:block}.stage-step b{color:var(--dim);font-size:10px}.stage-step span{margin-top:4px;font-size:11px;font-weight:800}.bundles{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line)}.bundle{padding:14px;background:#090909}.bundle b,.bundle span,.bundle small{display:block}.bundle b{font-size:14px;line-height:1.4}.bundle span{margin-top:7px;color:var(--amber);font-size:12px;font-weight:800;line-height:1.35}.bundle small{margin-top:7px;color:var(--muted);font-size:12px;line-height:1.4}.audit{max-height:26vh;overflow:auto}.audit-row{display:grid;grid-template-columns:42px 150px 1fr 220px;gap:10px;padding:10px 12px;border-bottom:1px solid #202020;color:var(--muted);font:650 10.5px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace}.audit-row b{color:#fff}.audit-row code{color:var(--green);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.error{padding:28px;color:var(--red);text-align:center}.boundary{padding:11px 13px;border-left:2px solid var(--amber);background:#11100a;color:var(--muted);font-size:12px;line-height:1.5}@media(max-width:1000px){.metrics,.bundles{grid-template-columns:repeat(2,1fr)}.top{display:block}.source{margin-top:12px;justify-items:start}.table-wrap,.audit{max-height:none}}
    table{min-width:800px}
  </style>
</head>
<body>
<main class="app">
  <section class="top"><div><div class="eyebrow">SPECTRA · 문서별 결과표</div><h1>어디까지 처리됐고,<br>어디서 보류됐는지 봅니다.</h1><p>공개 결과를 불러와 문서별 처리 상태를 표시합니다.</p></div><div class="source"><b id="source-state">불러오는 중</b><button id="reload" type="button">새로고침</button></div></section>
  <section class="metrics"><div class="metric"><span>전체 문서</span><b id="metric-docs">—</b></div><div class="metric"><span>공개 출처</span><b id="metric-published">—</b></div><div class="metric"><span>최종 단계 도달</span><b id="metric-complete">—</b></div><div class="metric"><span>판단 보류</span><b id="metric-hold">—</b></div></section>
  <section class="section"><div class="section-head"><b>문서별 처리 결과</b><span>접수 → 추출 → 역할 확인 → 조건 연결</span></div><div class="table-wrap"><table><thead><tr><th>문서</th><th>자료 역할</th><th>처리 경로</th><th>현재 결과</th><th>보류 지점</th></tr></thead><tbody id="documents"></tbody></table></div></section>
  <section class="section"><div class="section-head"><b>세 입력 연결 결과</b><span>임무·부품·시험 자료 대조</span></div><div class="bundles" id="bundles"></div></section>
  <section class="section"><div class="section-head"><b>감사 기록</b><span id="audit-head">해시 연결 + GCP 게시 확인</span></div><div class="audit" id="audit"></div></section>
  <div class="boundary">합성 자료와 공식 출처 요약만 포함합니다.</div>
</main>
<script>
(()=>{"use strict";
  const CLOUD_ROOT="https://storage.googleapis.com/spectra-public-test-catalog-iceu-686/v1",LOCAL_ROOT="/demo/data/test-catalog",$=id=>document.getElementById(id),node=(tag,text,className)=>{const item=document.createElement(tag);item.textContent=text;if(className)item.className=className;return item};
  const classFor=value=>value==="PASS"||value==="PIPELINE_COMPLETE"?"pass":value.includes("REJECT")||value.includes("FAILURE")?"bad":value==="NOT_REACHED"?"":value==="HOLD"||value.includes("STOP")||value.includes("CANDIDATE")?"hold":"";
  const statusLabels={PASS:"완료",NOT_REACHED:"—",NO_CANDIDATE:"후보 없음",CANDIDATE_ONLY:"연결 전",HOLD:"판단 보류",DATA_UNAVAILABLE:"처리 오류",PROVENANCE_FAILURE:"권리 확인 필요",CONTENT_REJECTED:"입력 차단",PIPELINE_COMPLETE:"최종 단계 도달",COMPLETED_WITH_HOLD:"처리 완료 · 보류",STOPPED_FAIL_CLOSED:"중간 보류"};
  const roleLabels={MISSION_PLAN:"임무 조건",PART_SPEC:"부품 명세",RADIATION_TEST:"방사선 시험 결과",SYNTHETIC_CONTROL:"합성 테스트"};
  const sourceLabels={PUBLISHED_SOURCE_SUMMARY:"공개 출처 요약",SYNTHETIC_TEST_FIXTURE:"합성 테스트 자료"};
  const responsibilityLabels={LOCAL_DOCUMENT_GATE:"문서 검사",MISSION_AGENT:"임무 검토",PARTS_AGENT:"부품·시험 검토",ASSURANCE_AGENT:"최종 검토"};
  const blockerLabels={NO_REVIEWABLE_CANDIDATE:"검토 후보 필요",PDF_TEXT_EXTRACTION_FAILED:"텍스트 추출 오류",PROMPT_INJECTION_PATTERN_DETECTED:"문서 지시문 차단",RIGHTS_PROCESS_LOCAL_UNRESOLVED:"처리 권리 확인 필요",RADIATION_ENVIRONMENT_MISSING:"방사선 환경 필요",RADIATION_TEST_EVIDENCE_MISSING:"방사선 시험 결과 필요",APPROVED_BOM_TARGET_MISSING:"비교 대상 부품 필요",EXACT_PART_IDENTITY_MISMATCH:"부품 식별 불일치",PART_SPECIFICATION_MISSING:"부품 명세 필요",SYNTHETIC_OR_INCOMPLETE_EVIDENCE:"근거 보완 필요",SYNTHETIC_ONLY:"합성 입력"};
  async function loadPair(root){const [catalogResponse,auditResponse,receiptResponse]=await Promise.all([fetch(`${root}/catalog.json`,{cache:"no-store"}),fetch(`${root}/audit-log.json`,{cache:"no-store"}),fetch(`${root}/deployment-receipt.json`,{cache:"no-store"})]);if(!catalogResponse.ok||!auditResponse.ok||!receiptResponse.ok)throw new Error("CATALOG_FETCH_FAILED");return [await catalogResponse.json(),await auditResponse.json(),await receiptResponse.json()]}
  function render(catalog,audit,receipt,source){
    const holdCount=catalog.documents.filter(item=>item.assurance_decision==="HOLD"||item.partial_evaluation?.assurance_decision==="HOLD"||item.pipeline_result==="COMPLETED_WITH_HOLD"||item.pipeline_result==="STOPPED_FAIL_CLOSED").length;
    $("source-state").textContent=source;$("source-state").className=source.startsWith("GCP")?"pass":"hold";$("metric-docs").textContent=catalog.summary.document_count;$("metric-published").textContent=catalog.summary.published_summary_count;$("metric-complete").textContent=catalog.summary.pipeline_complete_count;$("metric-hold").textContent=holdCount;
    $("documents").replaceChildren();catalog.documents.forEach(item=>{const tr=document.createElement("tr"),title=document.createElement("td"),displayTitle=item.title.replace(/^\d+_/u,"").replaceAll("_"," · ");title.append(node("strong",displayTitle),node("small",`${item.document_id} · ${sourceLabels[item.source_classification]||item.source_classification}`));if(item.source_urls.length){const link=node("a","공식 출처 열기","source-link");link.href=item.source_urls[0];link.target="_blank";link.rel="noopener";title.append(link)}const stageCell=document.createElement("td"),track=node("div","","stage-track");[["접수","INGEST"],["추출","PARSE"],["역할","ROLE_LINK"],["조건","CONDITION_LINK"]].forEach(([label,stage])=>{const value=item.stages[stage],step=node("div","","stage-step");step.append(node("b",label),node("span",statusLabels[value]||value,classFor(value)));track.append(step)});stageCell.append(track);tr.append(title,node("td",roleLabels[item.document_role]||item.document_role),stageCell);const partial=item.partial_evaluation,result=document.createElement("td");result.append(node("strong",statusLabels[item.pipeline_result]||item.pipeline_result,classFor(item.pipeline_result)),node("small",`확인 ${partial.validated_check_count} · 불일치 ${partial.failed_check_count} · 추가 ${partial.not_evaluated_check_count}`));tr.append(result);const blocker=document.createElement("td");blocker.append(node("strong",responsibilityLabels[partial.hold_agent]||partial.hold_agent,"hold"),node("small",blockerLabels[item.first_blocker]||item.first_blocker));tr.append(blocker);$("documents").append(tr)});
    $("bundles").replaceChildren();catalog.bundles.forEach(item=>{const card=node("article","","bundle");card.append(node("b",item.label),node("span",statusLabels[item.pipeline_result]||item.pipeline_result),node("small",`${responsibilityLabels[item.hold_agent]||item.hold_agent} · ${blockerLabels[item.first_blocker]||item.first_blocker}`));$("bundles").append(card)});
    $("audit-head").textContent=`해시 체인 ${audit.events.length}건 + GCP 게시 영수증 · 마지막 해시 ${audit.chain_head.slice(0,20)}…`;$("audit").replaceChildren();audit.events.forEach(item=>{const row=node("div","","audit-row"),eventLabel=item.event_type==="DOCUMENT_EVALUATED"?"문서 처리 기록":"카탈로그 제출 기록";row.append(node("b",String(item.sequence).padStart(2,"0")),node("span",eventLabel),node("span",item.document_id||`문서 ${item.document_count}개`),node("code",item.event_hash));$("audit").append(row)});const cloudRow=node("div","","audit-row");cloudRow.append(node("b","GCP"),node("span","공개 객체 확인"),node("span",`${receipt.published_object_count}개 · HTTP ${receipt.public_http_status} · CORS ${receipt.cors_allow_origin}`),node("code",`catalog gen ${receipt.catalog.generation} · audit gen ${receipt.audit_log.generation}`));$("audit").append(cloudRow);
  }
  async function load(){try{const [catalog,audit,receipt]=await loadPair(CLOUD_ROOT);render(catalog,audit,receipt,"GCP 연결")}catch(_cloud){try{const [catalog,audit,receipt]=await loadPair(LOCAL_ROOT);render(catalog,audit,receipt,"로컬 저장본")}catch(_local){const row=document.createElement("tr"),cell=node("td","문서 결과를 불러오지 못했습니다.","error");cell.colSpan=5;row.append(cell);$("documents").replaceChildren(row);$("source-state").textContent="자료 없음"}}}
  $("reload").addEventListener("click",load);load();
})();
</script>
</body>
</html>
